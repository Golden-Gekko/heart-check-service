[project]
name = "heart-api"
version = "0.2.0"
description = "REST API для предсказания риска сердечного приступа с мониторингом и алертингом"
requires-python = "~=3.9.0"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "python-multipart==0.0.20",
    "pyspark==3.0.3",
    "mlflow==2.17.2",
    "boto3==1.37.22",
    "requests==2.32.5",
    "prometheus-client==0.21.0",
    "kafka-python-ng==2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
    "ruff==0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-m 'not integration'"
markers = [
    "integration: интеграционные тесты (обучение heart-модели, требуют Java)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
